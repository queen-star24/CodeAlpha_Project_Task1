<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Image Gallery</title>
    <link rel="stylesheet" href="style.css"></link>
    
</head>
<body>
    <h1 class="one">Wedding Event Gallery</h1>
    <div class="gallery-container">
        <img src="assest/images/images 1.jpg" alt="Wedding 1" class="gallery-item" data-full-src="assest/images/images 1.jpg">
        <img src="assest/images/images 2.jpg" alt="Wedding 2" class="gallery-item" data-full-src="assest/images/images 2.jpg">
        <img src="assest/images/images 3.jpg" alt="Wedding 3" class="gallery-item" data-full-src="assest/images/images 3.jpg">
        <img src="assest/images/images 4.jpg" alt="Wedding 4" class="gallery-item" data-full-src="assest/images/images 4.jpg">
        <img src="assest/images/images 8.jpg" alt="Wedding 5" class="gallery-item" data-full-src="assest/images/images 8.jpg">
        <img src="assest/images/images 2.jpg" alt="Wedding 6" class="gallery-item" data-full-src="assest/images/images 2.jpg">
        <img src="assest/images/images 7.jpg" alt="Wedding 7" class="gallery-item" data-full-src="assest/images/images 7.jpg">
        <img src="assest/images/images 5.jpg" alt="Wedding 8" class="gallery-item" data-full-src="assest/images/images 5.jpg">
        <img src="assest/images/images 3.jpg" alt="Wedding 9" class="gallery-item" data-full-src="assest/images/images 3.jpg">
        <img src="assest/images/images 6.jpg" alt="Wedding 10" class="gallery-item" data-full-src="assest/images/images 6.jpg">

        <img src="assest/images/images 5.jpg" alt="Wedding 11" class="gallery-item inverted"  data-full-src="assest/images/images 5.jpg">
        <img src="assest/images/images 1.jpg" alt="Wedding 12" class="gallery-item inverted" data-full-src="assest/images/images 1.jpg">
        <img src="assest/images/images 8.jpg" alt="Wedding 13" class="gallery-item inverted"  data-full-src="assest/images/images 8.jpg">
        <img src="assest/images/images 4.jpg" alt="Wedding 14" class="gallery-item inverted" data-full-src="assest/images/images 4.jpg">
        <img src="assest/images/images 7.jpg" alt="Wedding 15" class="gallery-item inverted" data-full-src="assest/images/images 7.jpg">
        <img src="assest/images/images 1.jpg" alt="Wedding 16" class="gallery-item inverted" data-full-src="assest/images/images 1.jpg">
        <img src="assest/images/images 2.jpg" alt="Wedding 17" class="gallery-item inverted" data-full-src="assest/images/images 2.jpg">
        <img src="assest/images/images 3.jpg" alt="Wedding 18" class="gallery-item inverted" data-full-src="assest/images/images 3.jpg">
        <img src="assest/images/images 5.jpg" alt="Wedding 19" class="gallery-item inverted" data-full-src="assest/images/images 5.jpg">
        <img src="assest/images/images 7.jpg" alt="Wedding 20" class="gallery-item inverted" data-full-src="assest/images/images 7.jpg">
    </div>
    
    <div id="modal"> <!-- Create a modal container for displaying images -->
        <span id="modal-close">&times;</span> <!-- Close button for the modal -->
        <img id="modal-img" src="" alt="Full Size Image"> <!-- Image element to display the full-size image -->
        <span id="modal-prev">&#10094;</span> <!-- Previous button for navigating images -->
        <span id="modal-next">&#10095;</span> <!-- Next button for navigating images -->
    </div>
    
    <script>
        // Select all elements with the class 'gallery-item' and store them in a NodeList
        const galleryItems = document.querySelectorAll('.gallery-item');
        
        // Get the modal element by its ID
        const modal = document.getElementById('modal');
        
        // Get the image element inside the modal for displaying the full-size image
        const modalImg = document.getElementById('modal-img');
        
        // Get the close button element for the modal
        const modalClose = document.getElementById('modal-close');
        
        // Get the previous button element for the modal
        const modalPrev = document.getElementById('modal-prev');
        
        // Get the next button element for the modal
        const modalNext = document.getElementById('modal-next');
        
        // Initialize a variable to keep track of the currently displayed image index
        let currentImgIndex = 0;
    
        // Loop through each gallery item and add a click event listener
        galleryItems.forEach((item, index) => {
            item.addEventListener('click', () => { // When the item is clicked
                currentImgIndex = index; // Set the current image index to the clicked item's index
                const fullSrc = item.dataset.fullSrc; // Get the full-size image source from the data attribute
                modalImg.src = fullSrc; // Set the modal image source to the full-size image
                modal.style.display = 'flex'; // Display the modal
            });
        });
    
        // Add a click event listener to the close button
        modalClose.addEventListener('click', () => {
            modal.style.display = 'none'; // Hide the modal when the close button is clicked
        });
    
        // Add a click event listener to the previous button
        modalPrev.addEventListener('click', () => {
            // Update the current image index to the previous image, wrapping around if necessary
            currentImgIndex = (currentImgIndex - 1 + galleryItems.length) % galleryItems.length;
            const fullSrc = galleryItems[currentImgIndex].dataset.fullSrc; // Get the new full-size image source
            modalImg.src = fullSrc; // Update the modal image source
        });
    
        // Add a click event listener to the next button
        modalNext.addEventListener('click', () => {
            // Update the current image index to the next image, wrapping around if necessary
            currentImgIndex = (currentImgIndex + 1) % galleryItems.length;
            const fullSrc = galleryItems[currentImgIndex].dataset.fullSrc; // Get the new full-size image source
            modalImg.src = fullSrc; // Update the modal image source
        });
    
        // Add a click event listener to the modal itself
        modal.addEventListener('click', (event) => {
            // Check if the click was on the modal background (not on the image or buttons)
            if (event.target === modal) {
                modal.style.display = 'none'; // Hide the modal if the background is clicked
            }
        });
    </script>
</body>
</html>
